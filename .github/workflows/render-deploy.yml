name: Render Deploy

on:

  workflow_run:

    workflows:
      - CI
      - Code Quality
      - Security Scan

    types:
      - completed

jobs:

  deploy:

    if: >
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    steps:

      - name: Trigger Deploy
        run: |
          curl \
          --fail \
          --silent \
          --show-error \
          -X POST \
          "${{ secrets.RENDER_DEPLOY_HOOK }}"