name: Release

on:

  push:

    tags:
      - "v*"

jobs:

  release:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Build API
        run: |
          mkdir dist

          GOOS=linux GOARCH=amd64 \
          go build \
          -o dist/tinyurl-linux-amd64 \
          ./cmd/api

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*